# La config web Firebase est publique par conception : Next.js l'inclut dans le JavaScript
# envoyé au navigateur. Le scan de secrets de Netlify la retrouve dans le build et bloque le déploiement.
# La sécurité des données repose sur les règles Firestore, pas sur ces valeurs.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID"
